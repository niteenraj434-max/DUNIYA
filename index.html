<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            50: '#f9fafb', 100: '#f3f4f6', 200: '#e5e7eb',
                            700: '#374151', 800: '#1f2937', 900: '#111827',
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Background */
        body {
            background-image: url('https://images.unsplash.com/photo-1508610048659-a06b669e3321?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 0.5s ease;
        }

        /* Overlays */
        html.dark body::before {
            content: ''; position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: -1;
        }
        html:not(.dark) body::before {
            content: ''; position: fixed; inset: 0;
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(2px); z-index: -1;
        }

        /* Glass Panels */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        html.dark .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }

        /* Chat Bubbles Defaults (Dynamically overridden via JS) */
        .ai-bubble { background: transparent; }
        .user-bubble { background: rgba(37, 99, 235, 0.9); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        html.dark .user-bubble { background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.3); color: #e2e8f0; }

        /* Tables & Code */
        .message-content table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.9em; background: rgba(255,255,255,0.05); border-radius: 8px; overflow: hidden;}
        .message-content th, .message-content td { padding: 12px 15px; border: 1px solid rgba(156, 163, 175, 0.2); }
        .message-content thead tr { background-color: rgba(37, 99, 235, 0.1); text-align: left; }
        html.dark .message-content thead tr { background-color: rgba(59, 130, 246, 0.2); color: white !important;}

        pre { background-color: rgba(15, 23, 42, 0.8) !important; border-radius: 0.75rem; padding: 1rem; border: 1px solid rgba(255,255,255,0.1); }
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.5em 0; }
        .dark .katex { color: #f8fafc; }

        /* Action Pills */
        .action-pill { background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.8); color: #1f2937; transition: all 0.2s ease; }
        html.dark .action-pill { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: #f3f4f6; }
        .action-pill:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-1px); }
        html.dark .action-pill:hover { background: rgba(255, 255, 255, 0.2); }

        /* Hollow Input Styling */
        .hollow-input-wrapper {
            background: transparent !important;
            border-width: 2px;
            border-color: rgba(156, 163, 175, 0.4);
            transition: all 0.3s ease;
        }
        .hollow-input-wrapper:focus-within {
            border-color: var(--theme-hex, #3b82f6);
            box-shadow: 0 0 10px rgba(var(--theme-rgb, 59, 130, 246), 0.2);
        }
        html.dark .hollow-input-wrapper { border-color: rgba(255, 255, 255, 0.2); }
        html.dark .hollow-input-wrapper:focus-within { border-color: var(--theme-hex, #3b82f6); }
    </style>
</head>
<body class="text-gray-900 dark:text-gray-100 overflow-hidden font-sans transition-colors duration-500">

    <div id="loading" class="flex h-screen w-full items-center justify-center bg-white/80 dark:bg-gray-900/80 backdrop-blur-md absolute inset-0 z-[100]">
        <svg class="animate-spin h-10 w-10 text-blue-500 dynamic-text-color" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </div>

    <div id="app" class="hidden flex h-screen w-full relative">

        <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="glass-panel fixed md:relative inset-y-0 left-0 z-50 w-72 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col h-full border-r border-white/40 dark:border-white/10 m-0 md:m-2 md:rounded-2xl shadow-xl">
            <div class="p-4 flex items-center justify-between">
                <button onclick="createNewChat()" class="flex-1 glass-panel hover:bg-white/80 dark:hover:bg-gray-800/80 rounded-xl p-3 flex items-center gap-2 transition-colors font-medium text-sm shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    New Chat
                </button>
                <button onclick="toggleSidebar()" class="md:hidden ml-2 p-2 text-gray-500 hover:text-gray-900 dark:hover:text-white rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div id="chat-list" class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-1"></div>

            <div class="p-4 space-y-2 border-t border-white/40 dark:border-white/10">
                
                <div class="relative w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/60 dark:hover:bg-gray-800/60 transition-colors cursor-pointer overflow-hidden group">
                    <svg class="w-5 h-5 dynamic-text-color" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                    <span class="text-sm font-medium">Accent Color</span>
                    <input type="color" id="color-picker" class="absolute -inset-4 w-[150%] h-[150%] opacity-0 cursor-pointer" oninput="updateAccentColor(this.value)" onchange="updateAccentColor(this.value)">
                </div>

                <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/60 dark:hover:bg-gray-800/60 transition-colors text-sm font-medium">
                    <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <span id="theme-text">Toggle Theme</span>
                </button>
                <button onclick="openSettings()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-white/60 dark:hover:bg-gray-800/60 transition-colors text-sm font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Settings
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen min-w-0 relative bg-transparent z-10">
            
            <header class="md:hidden glass-panel flex items-center justify-between p-4 shrink-0 z-20 m-2 rounded-xl">
                <button onclick="toggleSidebar()" class="p-2 -ml-2 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="font-semibold text-lg truncate px-4" id="mobile-chat-title">New Chat</h1>
                <div class="w-6"></div> 
            </header>

            <div id="hub-view" class="absolute inset-0 flex flex-col items-center justify-center p-4 overflow-y-auto hidden z-10">
                <h2 class="text-3xl md:text-4xl font-bold mb-8 text-gray-800 dark:text-gray-100 drop-shadow-md text-center">Hi there. What should we dive into today?</h2>
                <div id="hub-input-slot" class="w-full max-w-2xl mb-6"></div>
                <div class="flex flex-wrap justify-center gap-3 mb-10 max-w-3xl">
                    <button class="action-pill px-5 py-2 rounded-full text-sm font-medium">Create an image</button>
                    <button class="action-pill px-5 py-2 rounded-full text-sm font-medium">Find the best deal</button>
                    <button class="action-pill px-5 py-2 rounded-full text-sm font-medium">Predict the future</button>
                    <button class="action-pill px-5 py-2 rounded-full text-sm font-medium">Take a quiz</button>
                </div>
            </div>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 pb-48 z-10 hidden"></div>

            <div id="chat-input-slot" class="absolute bottom-0 w-full pt-10 pb-8 px-4 md:px-8 bg-gradient-to-t from-white/90 via-white/50 dark:from-gray-900/90 dark:via-gray-900/50 to-transparent z-20 hidden pointer-events-none flex justify-center"></div>

            <div id="main-input-block" class="w-full max-w-2xl relative flex items-center gap-2 hollow-input-wrapper rounded-[2rem] p-2 pl-4 pointer-events-auto backdrop-blur-md">
                
                <button class="p-2 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors rounded-full flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
                
                <textarea 
                    id="user-input" 
                    rows="1" 
                    placeholder="Ask anything..." 
                    class="w-full bg-transparent border-none focus:ring-0 resize-none py-3 max-h-32 text-gray-900 dark:text-gray-100 text-base outline-none placeholder-gray-500 dark:placeholder-gray-400 font-medium"
                    oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px';"
                    onkeydown="handleEnter(event)"
                ></textarea>
                
                <div class="flex items-center gap-1 pr-2">
                    <button class="p-2 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors hidden sm:block">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                    <button class="p-2 text-gray-500 hover:text-gray-900 dark:hover:text-white transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    </button>
                    
                    <button 
                        id="send-btn" 
                        onclick="sendMessage()" 
                        class="p-2 border-2 border-gray-400 dark:border-gray-500 text-gray-600 dark:text-gray-300 hover:text-white dark:hover:text-white hover:bg-gray-800 dark:hover:bg-gray-100 dark:hover:text-gray-900 rounded-full flex-shrink-0 transition-all disabled:opacity-50 disabled:cursor-not-allowed h-10 w-10 flex items-center justify-center ml-1 bg-transparent hollow-send-btn"
                    >
                        <svg class="w-4 h-4 transform rotate-90 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                    </button>
                </div>
            </div>

            <div id="disclaimer" class="absolute bottom-2 w-full text-center text-[11px] text-gray-600 dark:text-gray-300 font-medium tracking-wide pointer-events-auto z-20 hidden">
                AI can make mistakes. Verify important information.
            </div>
            
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="glass-panel rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90dvh] bg-white dark:bg-gray-900">
            <div class="p-6 border-b border-gray-200 dark:border-white/10 flex justify-between items-center">
                <h2 class="text-xl font-bold">Settings</h2>
                <button onclick="closeSettings()" class="text-gray-500 hover:text-gray-900 dark:hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 space-y-5 overflow-y-auto">
                <div>
                    <label class="block text-sm font-medium mb-2">OpenRouter API Key <span class="text-blue-500 dynamic-text-color">*</span></label>
                    <input type="password" id="api-key" placeholder="sk-or-v1-..." class="w-full p-3 bg-transparent border border-gray-300 dark:border-gray-600 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm hollow-input-wrapper">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Model Name</label>
                    <input type="text" id="model-name" placeholder="deepseek/deepseek-r1:free" class="w-full p-3 bg-transparent border border-gray-300 dark:border-gray-600 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm hollow-input-wrapper">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">System Prompt</label>
                    <textarea id="system-prompt" rows="3" class="w-full p-3 bg-transparent border border-gray-300 dark:border-gray-600 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none hollow-input-wrapper"></textarea>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 dark:border-white/10 flex justify-end gap-3">
                <button onclick="closeSettings()" class="px-5 py-2.5 rounded-xl text-sm font-medium border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-5 py-2.5 rounded-xl text-sm font-medium dynamic-bg-color text-white shadow-lg transition-colors border-none">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const STATE_KEY = 'universal_ai_state';
        let state = {
            chats: [],
            currentChatId: null,
            settings: {
                apiKey: '',
                model: 'deepseek/deepseek-r1:free',
                systemPrompt: 'You are a helpful AI assistant. Always wrap mathematical expressions, variables, and LaTeX commands in $ for inline math and $$ for block math equations.',
                darkMode: true,
                accentColor: '#3b82f6' // Default Tailwind Blue-500
            }
        };

        let isGenerating = false;
        let abortController = null;

        // --- DOM Elements ---
        const els = {
            app: document.getElementById('app'),
            loading: document.getElementById('loading'),
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            chatList: document.getElementById('chat-list'),
            messagesContainer: document.getElementById('messages-container'),
            sendBtn: document.getElementById('send-btn'),
            
            hubView: document.getElementById('hub-view'),
            hubInputSlot: document.getElementById('hub-input-slot'),
            chatInputSlot: document.getElementById('chat-input-slot'),
            mainInputBlock: document.getElementById('main-input-block'),
            disclaimer: document.getElementById('disclaimer'),
            
            settingsModal: document.getElementById('settings-modal'),
            apiKeyInput: document.getElementById('api-key'),
            modelNameInput: document.getElementById('model-name'),
            systemPromptInput: document.getElementById('system-prompt'),
            mobileChatTitle: document.getElementById('mobile-chat-title'),
            textarea: document.getElementById('user-input'),
            colorPicker: document.getElementById('color-picker')
        };

        // --- Initialization ---
        function init() {
            try {
                const saved = localStorage.getItem(STATE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                    state.settings = { ...state.settings, ...(parsed.settings || {}) };
                }
            } catch (e) { console.error("Failed to parse local storage", e); }

            applyTheme();
            applyAccentColor(state.settings.accentColor || '#3b82f6');
            els.colorPicker.value = state.settings.accentColor || '#3b82f6';
            
            marked.setOptions({ breaks: true, gfm: true });

            if (state.chats.length === 0) createNewChat(false);
            else if (!state.currentChatId) state.currentChatId = state.chats[0].id;

            renderChatList();
            renderCurrentChat();

            els.loading.style.display = 'none';
            els.app.classList.remove('hidden');

            if (window.innerWidth > 768) els.textarea.focus();
        }

        function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

        // --- Core Utilities ---
        function generateId() { return Math.random().toString(36).substring(2, 15); }
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }
        function scrollToBottom() { els.messagesContainer.scrollTop = els.messagesContainer.scrollHeight; }

        // --- Dynamic Color Management ---
        function updateAccentColor(hexCode) {
            state.settings.accentColor = hexCode;
            applyAccentColor(hexCode);
            saveState();
        }

        function applyAccentColor(hex) {
            if(!hex) return;
            // Convert Hex to RGB for alpha manipulations
            let r = parseInt(hex.slice(1, 3), 16),
                g = parseInt(hex.slice(3, 5), 16),
                b = parseInt(hex.slice(5, 7), 16);

            const root = document.documentElement;
            root.style.setProperty('--theme-hex', hex);
            root.style.setProperty('--theme-rgb', `${r}, ${g}, ${b}`);

            // Inject styles dynamically to override Tailwind defaults
            let styleTag = document.getElementById('dynamic-theme-styles');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'dynamic-theme-styles';
                document.head.appendChild(styleTag);
            }

            styleTag.innerHTML = `
                .dynamic-text-color { color: ${hex} !important; }
                .dynamic-bg-color { background-color: ${hex} !important; }
                .focus\\:ring-blue-500:focus { --tw-ring-color: ${hex} !important; }
                
                /* Update Send Button Hollow Hover State */
                .hollow-send-btn:hover:not(:disabled) {
                    border-color: ${hex} !important;
                    color: ${hex} !important;
                    background-color: transparent !important;
                    box-shadow: 0 0 12px rgba(${r}, ${g}, ${b}, 0.2);
                }

                /* Active Chat List Item */
                .active-chat-item {
                    border-color: rgba(${r}, ${g}, ${b}, 0.5) !important;
                    background-color: rgba(${r}, ${g}, ${b}, 0.1) !important;
                }

                /* User Message Bubbles */
                .user-bubble { 
                    background: rgba(${r}, ${g}, ${b}, 0.9) !important; 
                    box-shadow: 0 4px 15px rgba(${r}, ${g}, ${b}, 0.3) !important; 
                }
                html.dark .user-bubble { 
                    background: rgba(${r}, ${g}, ${b}, 0.25) !important; 
                    border: 1px solid rgba(${r}, ${g}, ${b}, 0.4) !important; 
                }

                /* Tables generated by markdown */
                .message-content thead tr { background-color: rgba(${r}, ${g}, ${b}, 0.15) !important; }
                html.dark .message-content thead tr { background-color: rgba(${r}, ${g}, ${b}, 0.3) !important; }
            `;
        }

        // --- Theme Management ---
        function toggleDarkMode() {
            state.settings.darkMode = !state.settings.darkMode;
            applyTheme();
            saveState();
        }

        function applyTheme() {
            const html = document.documentElement;
            if (state.settings.darkMode) html.classList.add('dark');
            else html.classList.remove('dark');
        }

        // --- Sidebar ---
        function toggleSidebar() {
            const isClosed = els.sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                els.sidebar.classList.remove('-translate-x-full');
                els.sidebarOverlay.classList.remove('hidden');
            } else {
                els.sidebar.classList.add('-translate-x-full');
                els.sidebarOverlay.classList.add('hidden');
            }
        }

        // --- Settings ---
        function openSettings() {
            els.apiKeyInput.value = state.settings.apiKey || '';
            els.modelNameInput.value = state.settings.model || 'deepseek/deepseek-r1:free';
            els.systemPromptInput.value = state.settings.systemPrompt || '';
            els.settingsModal.classList.remove('hidden');
            if(window.innerWidth < 768) toggleSidebar();
        }
        function closeSettings() { els.settingsModal.classList.add('hidden'); }
        function saveSettings() {
            state.settings.apiKey = els.apiKeyInput.value.trim();
            state.settings.model = els.modelNameInput.value.trim() || 'deepseek/deepseek-r1:free';
            state.settings.systemPrompt = els.systemPromptInput.value.trim();
            saveState();
            closeSettings();
        }

        // --- Chats ---
        function createNewChat(shouldRender = true) {
            if (isGenerating) return;
            const newChat = { id: generateId(), title: 'New Conversation', messages: [] };
            state.chats.unshift(newChat);
            state.currentChatId = newChat.id;
            saveState();
            if (shouldRender) {
                renderChatList();
                renderCurrentChat();
                if(window.innerWidth < 768) toggleSidebar();
                els.textarea.focus();
            }
        }

        function switchChat(id) {
            if (isGenerating) return;
            state.currentChatId = id;
            saveState();
            renderChatList();
            renderCurrentChat();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if (isGenerating) return;
            if (confirm("Delete this chat?")) {
                state.chats = state.chats.filter(c => c.id !== id);
                if (state.chats.length === 0) createNewChat(false);
                else if (state.currentChatId === id) state.currentChatId = state.chats[0].id;
                saveState();
                renderChatList();
                renderCurrentChat();
            }
        }

        function renderMathInElementSafely(element) {
            if (typeof renderMathInElement === 'function') {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }
        }

        function renderChatList() {
            els.chatList.innerHTML = '';
            state.chats.forEach(chat => {
                const isActive = chat.id === state.currentChatId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-colors ${isActive ? 'active-chat-item font-medium border' : 'border border-transparent hover:bg-white/20 dark:hover:bg-gray-800/40'}`;
                div.onclick = () => switchChat(chat.id);
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden flex-1">
                        <svg class="w-4 h-4 flex-shrink-0 ${isActive ? 'dynamic-text-color' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        <span class="truncate text-sm">${escapeHTML(chat.title)}</span>
                    </div>
                    <div class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="deleteChat('${chat.id}', event)" class="p-1 hover:text-red-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </div>
                `;
                els.chatList.appendChild(div);
            });
        }

        function renderCurrentChat() {
            const chat = state.chats.find(c => c.id === state.currentChatId);
            els.messagesContainer.innerHTML = '';
            els.mobileChatTitle.innerText = chat ? chat.title : 'New Chat';

            if (!chat || chat.messages.length === 0) {
                // Empty Hub Layout
                els.hubView.classList.remove('hidden');
                els.messagesContainer.classList.add('hidden');
                els.chatInputSlot.classList.add('hidden');
                els.disclaimer.classList.add('hidden');
                
                // Move hollow input to center
                els.hubInputSlot.appendChild(els.mainInputBlock);
                return;
            }

            // Active Chat Layout
            els.hubView.classList.add('hidden');
            els.messagesContainer.classList.remove('hidden');
            els.chatInputSlot.classList.remove('hidden');
            els.disclaimer.classList.remove('hidden');

            // Move hollow input to bottom fixed slot
            els.chatInputSlot.appendChild(els.mainInputBlock);

            chat.messages.forEach(msg => appendMessageToUI(msg.role, msg.content, false));
            scrollToBottom();
        }

        function appendMessageToUI(role, content, isStreaming = false) {
            const div = document.createElement('div');
            div.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} max-w-4xl mx-auto`;

            const innerClass = role === 'user' 
                ? 'user-bubble text-white rounded-[2rem] rounded-tr-sm px-6 py-4 max-w-[85%]' 
                : 'ai-bubble max-w-[100%] w-full prose dark:prose-invert prose-p:leading-relaxed prose-pre:my-2';

            div.innerHTML = `
                <div class="${role === 'user' ? '' : 'flex gap-4 w-full'}">
                    ${role === 'assistant' ? `
                        <div class="w-8 h-8 rounded-full bg-white dark:bg-gray-800 shadow-sm flex-shrink-0 flex items-center justify-center mt-1 border border-gray-200 dark:border-gray-700">
                            <svg class="w-5 h-5 dynamic-text-color" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                    ` : ''}
                    <div class="${innerClass} ${role === 'assistant' ? 'flex-1 min-w-0 glass-panel p-6 rounded-[2rem] rounded-tl-sm' : ''} message-content">
                        ${role === 'user' ? escapeHTML(content) : marked.parse(content || ' ')}
                    </div>
                </div>
            `;

            if (isStreaming) div.id = 'streaming-message';
            els.messagesContainer.appendChild(div);
            
            if (role === 'assistant' && !isStreaming) {
                renderMathInElementSafely(div.querySelector('.message-content'));
            }
            scrollToBottom();
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            if (isGenerating) return;
            const text = els.textarea.value.trim();
            if (!text) return;

            if (!state.settings.apiKey) {
                alert("Please set your OpenRouter API Key in settings first.");
                openSettings();
                return;
            }

            const chat = state.chats.find(c => c.id === state.currentChatId);
            if (chat.messages.length === 0) {
                chat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
                renderChatList();
                els.mobileChatTitle.innerText = chat.title;
            }

            chat.messages.push({ role: 'user', content: text });
            els.textarea.value = '';
            els.textarea.style.height = 'auto';
            
            renderCurrentChat();
            saveState();

            isGenerating = true;
            els.sendBtn.disabled = true;
            els.sendBtn.innerHTML = `<svg class="animate-spin w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;

            appendMessageToUI('assistant', '<span class="animate-pulse dynamic-text-color font-medium">Thinking...</span>', true);

            try {
                const apiMessages = [];
                if (state.settings.systemPrompt) apiMessages.push({ role: 'system', content: state.settings.systemPrompt });
                apiMessages.push(...chat.messages.slice(-10));

                abortController = new AbortController();

                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${state.settings.apiKey}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Universal AI Chat'
                    },
                    body: JSON.stringify({ model: state.settings.model, messages: apiMessages, stream: true }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || `HTTP Error ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let aiResponseText = '';
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith('data: ')) continue;
                        const dataStr = trimmed.replace(/^data: /, '').trim();
                        if (dataStr === '[DONE]') continue;

                        try {
                            const parsed = JSON.parse(dataStr);
                            aiResponseText += parsed.choices[0]?.delta?.content || '';
                            const streamEl = document.getElementById('streaming-message');
                            if (streamEl) {
                                streamEl.querySelector('.message-content').innerHTML = marked.parse(aiResponseText + '▋');
                                scrollToBottom();
                            }
                        } catch (e) {}
                    }
                }

                const streamEl = document.getElementById('streaming-message');
                if (streamEl) {
                    streamEl.removeAttribute('id');
                    const contentContainer = streamEl.querySelector('.message-content');
                    contentContainer.innerHTML = marked.parse(aiResponseText);
                    renderMathInElementSafely(contentContainer);
                }

                chat.messages.push({ role: 'assistant', content: aiResponseText });
                saveState();

            } catch (error) {
                const streamEl = document.getElementById('streaming-message');
                if (streamEl) {
                    streamEl.removeAttribute('id');
                    streamEl.querySelector('.message-content').innerHTML = `<span class="text-red-500 font-medium">Error: ${escapeHTML(error.message)}</span>`;
                }
            } finally {
                isGenerating = false;
                els.sendBtn.disabled = false;
                els.sendBtn.innerHTML = `<svg class="w-4 h-4 transform rotate-90 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>`;
                scrollToBottom();
                if (window.innerWidth > 768) els.textarea.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
